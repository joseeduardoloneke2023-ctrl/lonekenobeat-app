<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sessão | Loneke no Beat</title>
    
    <!-- Fontes Google & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            /* Paleta Cinza Escuro & Vermelho */
            --bg-dark: #0A0A0D;
            --card-bg: rgba(20, 20, 27, 0.85);
            --card-border: rgba(255, 255, 255, 0.07);
            --card-border-active: rgba(255, 46, 60, 0.5);
            
            --input-bg: rgba(13, 13, 18, 0.9);
            --input-border: rgba(255, 255, 255, 0.1);
            
            --primary-red: #FF2E3C;
            --primary-red-hover: #E50914;
            --red-glow: rgba(255, 46, 60, 0.35);
            --red-subtle: rgba(255, 46, 60, 0.08);

            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dark: #64748B;
            
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(255, 46, 60, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(255, 46, 60, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 0% 50%, rgba(30, 30, 45, 0.5) 0%, transparent 50%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(255, 46, 60, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .brand-logo {
            font-family: var(--font-heading);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .brand-logo span {
            color: var(--primary-red);
            text-shadow: 0 0 15px var(--red-glow);
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .btn-google {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: var(--transition);
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-google svg {
            width: 19px;
            height: 19px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.6rem 0;
            color: var(--text-dark);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider span {
            padding: 0 0.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.45rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1.1rem;
            color: var(--text-dark);
            font-size: 0.95rem;
            pointer-events: none;
            transition: var(--transition);
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 0.9rem 1.1rem 0.9rem 2.8rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.92rem;
            font-family: var(--font-body);
            transition: var(--transition);
        }

        .form-control::placeholder {
            color: var(--text-dark);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 18px var(--red-glow);
            background: rgba(18, 18, 25, 0.95);
        }

        .form-control:focus ~ .input-icon {
            color: var(--primary-red);
        }

        .toggle-password {
            position: absolute;
            right: 1.1rem;
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
            margin-top: -0.2rem;
        }

        .btn-forgot-password {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
            font-family: var(--font-body);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-forgot-password:hover {
            color: var(--primary-red);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-red) 0%, #D00010 100%);
            color: #FFFFFF;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            font-family: var(--font-body);
            cursor: pointer;
            border: none;
            transition: var(--transition);
            box-shadow: 0 10px 25px var(--red-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            letter-spacing: 0.3px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 46, 60, 0.5);
            filter: brightness(1.1);
        }

        .btn-register-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-register-link:hover {
            background: var(--red-subtle);
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .catalog-redirect {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .catalog-redirect a {
            color: var(--text-main);
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
            margin-left: 0.2rem;
        }

        .catalog-redirect a:hover {
            color: var(--primary-red);
        }

        .toast-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .toast-card {
            background: rgba(18, 18, 24, 0.95);
            color: var(--text-main);
            padding: 0.95rem 1.25rem;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--primary-red);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            font-size: 0.88rem;
            backdrop-filter: blur(12px);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 380px;
            border-top: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .toast-card.success { border-left-color: #10B981; }
        .toast-card.success i { color: #10B981; }
        .toast-card.error i { color: var(--primary-red); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem; }
            .toast-container { right: 15px; left: 15px; top: 15px; }
            .toast-card { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <main class="login-card">
        <div class="brand-header">
            <a href="index.html" class="brand-logo">LONEKE NO <span>BEAT</span></a>
            <p class="brand-subtitle">Aceda aos seus infoprodutos e downloads</p>
        </div>

        <!-- Botão Login Google -->
        <button type="button" class="btn-google" id="btnGoogleLogin">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Entrar com o Google
        </button>

        <div class="divider">
            <span>ou entre com e-mail</span>
        </div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="loginEmail" class="form-label">E-mail</label>
                <div class="input-wrapper">
                    <input type="email" id="loginEmail" class="form-control" placeholder="seu.email@exemplo.com" required>
                    <i class="fa-solid fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword" class="form-label">Palavra-passe</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" id="btnTogglePassword" title="Mostrar/Ocultar Palavra-passe">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <a href="esquece.html" class="btn-forgot-password" id="btnForgotPassword">
                    Esqueceu a palavra-passe?
                </a>
            </div>

            <button type="submit" class="btn-submit" id="btnLoginSubmit">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sessão
            </button>

            <!-- Botão de Criar Conta Integrado -->
            <a href="cadastro.html" class="btn-register-link">
                <i class="fa-solid fa-user-plus"></i> Não tem conta? Criar Conta VIP
            </a>
        </form>

        <div class="catalog-redirect">
            Ainda não adquiriu nenhum produto? <a href="../catalogo.html">Ver Catálogo</a>
        </div>
    </main>

    <!-- Script de Autenticação Firebase v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAccxyuNdi_E9Dpz0YPnWZwRC6mBU0AcVo",
            authDomain: "loneke-site-oficial.firebaseapp.com",
            projectId: "loneke-site-oficial",
            storageBucket: "loneke-site-oficial.firebasestorage.app",
            messagingSenderId: "716824234386",
            appId: "1:716824234386:web:9bd3a8359ba388eb0dd94b",
            measurementId: "G-MGJJPNDTM0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        auth.languageCode = 'pt';

        const ADMIN_EMAILS = [
    "suporte@lonekenobeat.com", // <-- E-mail adicionado aqui!
];

        function showToast(message, type = "error") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast-card ${type}`;
            
            const icon = type === "success" ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = "fadeOut 0.3s forwards";
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function handleUserSession(user) {
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                let userRole = "client";

                if (userSnap.exists()) {
                    userRole = userSnap.data().role || "client";
                } else {
                    const isAdmin = ADMIN_EMAILS.includes(user.email.toLowerCase());
                    userRole = isAdmin ? "admin" : "client";

                    await setDoc(userRef, {
                        uid: user.uid,
                        name: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        role: userRole,
                        createdAt: serverTimestamp()
                    }, { merge: true });
                }

                showToast(`Bem-vindo! A redirecionar...`, "success");

                setTimeout(() => {
                    if (userRole === "admin" || ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "cliente.html";
                    }
                }, 1000);

            } catch (error) {
                console.error("Erro ao verificar utilizador:", error);
                showToast("Erro ao carregar dados do perfil.");
            }
        }

        // Toggle Mostrar/Ocultar Senha
        const btnTogglePassword = document.getElementById("btnTogglePassword");
        const passwordInput = document.getElementById("loginPassword");
        const eyeIcon = document.getElementById("eyeIcon");

        btnTogglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            eyeIcon.className = isPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
        });

        // Entrar com Email/Senha
        const loginForm = document.getElementById("loginForm");
        const btnSubmit = document.getElementById("btnLoginSubmit");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = passwordInput.value;

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> A verificar...`;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await handleUserSession(userCredential.user);

            } catch (error) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sessão`;

                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    showToast("E-mail ou palavra-passe incorretos.");
                } else if (error.code === 'auth/too-many-requests') {
                    showToast("Muitas tentativas. Tente novamente mais tarde.");
                } else {
                    showToast("Erro ao iniciar sessão. Verifique os seus dados.");
                }
            }
        });

        // Entrar com Google
        const btnGoogle = document.getElementById("btnGoogleLogin");
        const googleProvider = new GoogleAuthProvider();

        btnGoogle.addEventListener("click", async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await handleUserSession(result.user);

            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    showToast("Erro na autenticação com o Google.");
                }
            }
        });
    </script>
</body>
</html>
